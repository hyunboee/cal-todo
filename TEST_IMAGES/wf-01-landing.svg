<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <!-- WF-01 정적 랜딩 스타일 시안 (다크 + 블루 포인트). 문구는 N-1 확인 필요 -->
  <defs>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#2a3cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a2a8a"/>
    </linearGradient>
    <pattern id="wm" width="170" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="0" y="40" font-size="12" fill="#ffffff" fill-opacity="0.08" font-weight="700">PREVIEW ONLY</text>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#07080c"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- 헤더 -->
  <g>
    <rect x="48" y="30" width="30" height="30" rx="7" fill="#4353ff"/>
    <text x="63" y="51" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text>
    <text x="90" y="52" font-size="19" font-weight="700" fill="#fff">Detail Maker</text>
    <text x="250" y="51" font-size="15" fill="#c9cbd6">작동 방식</text>
    <text x="340" y="51" font-size="15" fill="#c9cbd6">기능</text>
    <text x="1090" y="51" font-size="15" fill="#e6e7ee">로그인</text>
    <rect x="1170" y="22" width="222" height="46" rx="4" fill="#4353ff"/>
    <text x="1281" y="51" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">시작하기 — 무료 체험</text>
  </g>

  <!-- 좌측 히어로 -->
  <g>
    <rect x="48" y="130" width="258" height="34" rx="17" fill="#11131c" stroke="#23263a"/>
    <text x="64" y="152" font-size="11" letter-spacing="1.5" fill="#8a8ea3">• NEW</text>
    <rect x="118" y="134" width="182" height="26" rx="13" fill="#1a1f4d"/>
    <text x="134" y="152" font-size="13" fill="#9fa8ff">✦</text>
    <text x="152" y="152" font-size="13" font-weight="600" fill="#fff">AI 상세페이지 생성</text>

    <text x="46" y="262" font-size="66" font-weight="800" letter-spacing="-2" fill="#fff">쿠팡 상세페이지,</text>
    <text x="46" y="342" font-size="66" font-weight="800" letter-spacing="-2" fill="#fff"><tspan fill="#4f63ff">AI</tspan>로 10분 만에.</text>

    <text x="48" y="398" font-size="18" fill="#b9bccb">경쟁사 분석부터 상세페이지 생성, 편집, WING 등록용 HTML까지</text>
    <text x="48" y="426" font-size="18" fill="#b9bccb">버튼 몇 번으로 끝내세요. 결제는 최종 확정할 때만 1크레딧.</text>

    <rect x="48" y="466" width="206" height="52" rx="4" fill="#4353ff"/>
    <text x="151" y="498" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">시작하기 — 무료 체험</text>
    <text x="282" y="498" font-size="16" font-weight="600" fill="#fff">로그인</text>
    <path d="M338 487 l6 6 -6 6" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- 기능 3개 -->
    <g font-size="13">
      <rect x="48" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="67" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">⌕</text>
      <text x="100" y="580" font-weight="700" fill="#fff">경쟁사 분석</text>
      <text x="100" y="602" fill="#8a8ea3">1위 상품 리뷰에서</text>
      <text x="100" y="620" fill="#8a8ea3">소구점(USP)을 추출</text>

      <rect x="252" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="271" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">✦</text>
      <text x="304" y="580" font-weight="700" fill="#fff">AI 상세페이지</text>
      <text x="304" y="602" fill="#8a8ea3">780px 모바일 규격</text>
      <text x="304" y="620" fill="#8a8ea3">레이아웃을 자동 생성</text>

      <rect x="456" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="475" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">⇪</text>
      <text x="508" y="580" font-weight="700" fill="#fff">WING 등록</text>
      <text x="508" y="602" fill="#8a8ea3">확정한 HTML을 복사해</text>
      <text x="508" y="620" fill="#8a8ea3">상세설명에 붙여넣기</text>
    </g>

    <!-- 작동 방식 5단계 -->
    <text x="48" y="708" font-size="11" letter-spacing="2" fill="#6d7185">작동 방식 — 5단계</text>
    <g font-size="14" fill="#9a9db0">
      <text x="48" y="748"><tspan fill="#4f63ff" font-weight="700">1</tspan>  경쟁사 분석(선택)</text>
      <text x="206" y="748"><tspan fill="#4f63ff" font-weight="700">2</tspan>  생성</text>
      <text x="282" y="748"><tspan fill="#4f63ff" font-weight="700">3</tspan>  편집</text>
      <text x="358" y="748"><tspan fill="#4f63ff" font-weight="700">4</tspan>  확정(1크레딧)</text>
      <text x="494" y="748"><tspan fill="#4f63ff" font-weight="700">5</tspan>  HTML → WING</text>
    </g>
  </g>

  <!-- 우측 에디터 목업 -->
  <g>
    <rect x="672" y="120" width="720" height="672" rx="8" fill="#0e1016" stroke="#1f2230"/>
    <!-- 툴바 -->
    <rect x="672" y="120" width="720" height="40" rx="8" fill="#12141c"/>
    <rect x="684" y="130" width="20" height="20" rx="4" fill="#4353ff"/>
    <rect x="716" y="129" width="96" height="22" rx="4" fill="#1b1e2a"/>
    <text x="728" y="145" font-size="12" fill="#d7d9e3">에디터 ▾</text>
    <text x="838" y="145" font-size="12" fill="#8a8ea3">무선 청소기 · EDITING · v4</text>
    <text x="1196" y="145" font-size="12" fill="#8a8ea3">재생성 2/3</text>
    <rect x="1272" y="128" width="108" height="24" rx="4" fill="#4353ff"/>
    <text x="1326" y="145" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">퍼블리시 · 1크레딧</text>

    <!-- 좌측 아이콘 바 -->
    <rect x="672" y="160" width="38" height="632" fill="#0b0d12"/>
    <g fill="none" stroke="#5c6075" stroke-width="1.5">
      <path d="M684 188 h14 M691 181 v14"/>
      <rect x="684" y="222" width="14" height="14" rx="2"/>
      <circle cx="691" cy="268" r="7"/>
      <rect x="684" y="304" width="14" height="16" rx="2"/>
      <path d="M684 356 h14 M684 362 h14 M684 368 h10"/>
      <rect x="684" y="400" width="14" height="12" rx="2"/>
    </g>

    <!-- 프리뷰 캔버스 -->
    <rect x="710" y="160" width="682" height="428" fill="url(#canvasBg)"/>
    <circle cx="1080" cy="380" r="170" fill="#3346ff" fill-opacity="0.35"/>
    <rect x="948" y="240" width="180" height="280" rx="10" fill="#0a0d28" fill-opacity="0.7" stroke="#3b4bd8" stroke-opacity="0.5"/>
    <text x="1038" y="386" font-size="13" fill="#6f7dff" text-anchor="middle">[상품 이미지]</text>
    <text x="740" y="200" font-size="16" font-weight="700" fill="#fff">프리미엄 무선청소기</text>
    <text x="740" y="286" font-size="38" font-weight="700" fill="#fff" letter-spacing="-1">흡입력은</text>
    <text x="740" y="332" font-size="38" font-weight="700" fill="#fff" letter-spacing="-1">두 배,</text>
    <text x="740" y="378" font-size="38" font-weight="700" fill="#fff" letter-spacing="-1">무게는 절반</text>
    <text x="740" y="414" font-size="12" fill="#c3c8f5">리뷰 3,200건이 증명한 42dB 저소음.</text>
    <text x="740" y="432" font-size="12" fill="#c3c8f5">한 번 충전으로 60분 연속 사용.</text>
    <rect x="740" y="452" width="112" height="34" rx="3" fill="none" stroke="#e6e7ee"/>
    <text x="796" y="474" font-size="12" fill="#fff" text-anchor="middle">지금 구매하기</text>
    <!-- 워터마크 -->
    <rect x="710" y="160" width="682" height="428" fill="url(#wm)"/>
    <text x="930" y="560" font-size="26" font-weight="800" fill="#fff" fill-opacity="0.18" transform="rotate(-18 930 560)">PREVIEW ONLY / 무단 복제 금지</text>

    <!-- USP 패널 -->
    <rect x="1148" y="300" width="224" height="264" rx="8" fill="#12141d" stroke="#262a3b"/>
    <text x="1164" y="328" font-size="13" font-weight="700" fill="#fff"><tspan fill="#8f9bff">✦</tspan> USP 제안</text>
    <rect x="1236" y="316" width="42" height="16" rx="3" fill="#1d2140"/>
    <text x="1257" y="328" font-size="9" fill="#9fa8ff" text-anchor="middle">LIGHT</text>
    <text x="1356" y="328" font-size="13" fill="#6d7185">×</text>
    <text x="1164" y="354" font-size="11" fill="#8a8ea3">경쟁사 리뷰에서 찾은 소구점</text>
    <g font-size="12" fill="#d7d9e3">
      <rect x="1164" y="370" width="14" height="14" rx="3" fill="#4353ff"/><path d="M1167 377 l3 3 5 -6" stroke="#fff" fill="none" stroke-width="1.6"/>
      <text x="1186" y="382">강력한 흡입력</text>
      <rect x="1164" y="396" width="14" height="14" rx="3" fill="#4353ff"/><path d="M1167 403 l3 3 5 -6" stroke="#fff" fill="none" stroke-width="1.6"/>
      <text x="1186" y="408">가벼운 무게</text>
      <rect x="1164" y="422" width="14" height="14" rx="3" fill="none" stroke="#4a4e63"/>
      <text x="1186" y="434">긴 배터리 시간</text>
      <rect x="1164" y="448" width="14" height="14" rx="3" fill="none" stroke="#4a4e63"/>
      <text x="1186" y="460">저소음</text>
    </g>
    <text x="1164" y="492" font-size="10" fill="#6d7185">분석 시도 1/3</text>
    <rect x="1164" y="506" width="192" height="40" rx="4" fill="#5247ff"/>
    <text x="1260" y="531" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">✦ 상세페이지 생성</text>

    <!-- 코드 패널 -->
    <rect x="722" y="604" width="438" height="176" rx="6" fill="#0a0b10" stroke="#1c1f2b"/>
    <g font-family="Consolas, 'D2Coding', monospace" font-size="12">
      <text x="740" y="632" fill="#e0a86a">&lt;section <tspan fill="#7fb0ff">data-block-id</tspan>=<tspan fill="#9fd48a">"hero"</tspan></text>
      <text x="760" y="652" fill="#7fb0ff">style<tspan fill="#e0a86a">=</tspan><tspan fill="#9fd48a">"width:780px;padding:48px"</tspan><tspan fill="#e0a86a">&gt;</tspan></text>
      <text x="760" y="676" fill="#e0a86a">&lt;h1 <tspan fill="#7fb0ff">style</tspan>=<tspan fill="#9fd48a">"font-size:40px"</tspan>&gt;<tspan fill="#d7d9e3">흡입력은 두 배</tspan>&lt;/h1&gt;</text>
      <text x="760" y="700" fill="#e0a86a">&lt;p&gt;<tspan fill="#d7d9e3">리뷰 3,200건이 증명한 저소음 설계</tspan>&lt;/p&gt;</text>
      <text x="760" y="724" fill="#e0a86a">&lt;img <tspan fill="#7fb0ff">src</tspan>=<tspan fill="#9fd48a">"preview/…_wm.webp"</tspan>&gt;</text>
      <text x="740" y="752" fill="#e0a86a">&lt;/section&gt;</text>
      <text x="740" y="772" fill="#4d5166">// 인라인 CSS 전용 · script 없음</text>
    </g>

    <!-- 블록 편집 패널 -->
    <rect x="1172" y="604" width="208" height="176" rx="6" fill="#0f1118"/>
    <rect x="1184" y="616" width="26" height="20" rx="3" fill="#1b1e2a"/>
    <text x="1197" y="630" font-size="10" fill="#d7d9e3" text-anchor="middle">B1</text>
    <text x="1220" y="631" font-size="12" fill="#d7d9e3">블록 편집 · hero</text>
    <text x="1184" y="662" font-size="11" fill="#6d7185">텍스트</text>
    <rect x="1230" y="650" width="138" height="20" rx="3" fill="#161925"/>
    <text x="1238" y="664" font-size="10" fill="#8a8ea3">흡입력은 두 배</text>
    <text x="1184" y="692" font-size="11" fill="#6d7185">블록</text>
    <rect x="1230" y="680" width="138" height="20" rx="3" fill="#1a1f4d"/>
    <text x="1238" y="694" font-size="10" fill="#9fa8ff">hero</text>
    <line x1="1184" y1="714" x2="1368" y2="714" stroke="#1f2230"/>
    <text x="1184" y="736" font-size="12" fill="#d7d9e3">AI 부분 수정</text>
    <text x="1184" y="758" font-size="10" fill="#6d7185">성공 0/3 · 실패 0/6</text>
    <rect x="1300" y="744" width="68" height="22" rx="3" fill="#1b1e2a"/>
    <text x="1334" y="759" font-size="10" fill="#d7d9e3" text-anchor="middle">저장</text>
  </g>

  <!-- 하단 주석 -->
  <text x="48" y="868" font-size="11" fill="#4d5166">WF-01 정적 랜딩 스타일 시안 · 헤드라인·카피는 예시(확인 필요 N-1) · 우측은 서비스 에디터(WF-06) 미리보기</text>
</svg>
