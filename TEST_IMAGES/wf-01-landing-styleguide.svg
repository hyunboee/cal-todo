<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <!-- WF-01 정적 랜딩: docs/9-style-guide.md v0.1 토큰·컴포넌트 적용. 구조는 docs/4-wireframes.md WF-01(헤더 → 히어로·CTA → 작동 방식 5단계 → 하단 CTA). 카피는 예시(N-1 확인 필요) -->
  <defs>
    <!-- gradient-glow -->
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#2a3cff" stop-opacity="0.55"/>
      <stop offset="0.9" stop-color="#2a3cff" stop-opacity="0"/>
    </radialGradient>
    <!-- gradient-canvas -->
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a2a8a"/>
    </linearGradient>
    <!-- 6.10 반복 워터마크: PREVIEW ONLY 12/700, color-watermark, 170x90, -25° -->
    <pattern id="wm" width="170" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <text x="0" y="40" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.08">PREVIEW ONLY</text>
    </pattern>
    <clipPath id="canvasClip"><rect x="710" y="160" width="682" height="390"/></clipPath>
  </defs>

  <!-- color-bg-page + 글로우 -->
  <rect width="1440" height="1360" fill="#07080c"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- 6.11 WF-01 헤더: 높이 90, 좌우 48 -->
  <g>
    <rect x="48" y="30" width="30" height="30" rx="6" fill="#4353ff"/>
    <text x="63" y="51" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
    <text x="90" y="52" font-size="19" font-weight="700" fill="#ffffff">Detail Maker</text>
    <text x="250" y="51" font-size="15" fill="#b9bccb">작동 방식</text>
    <text x="340" y="51" font-size="15" fill="#b9bccb">기능</text>
    <text x="1104" y="51" font-size="15" fill="#d7d9e3">로그인</text>
    <!-- Primary(헤더) 높이 46, 패딩 24, ui-md/600, radius-sm -->
    <rect x="1170" y="22" width="222" height="46" rx="4" fill="#4353ff"/>
    <text x="1281" y="51" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">시작하기 — 무료 체험</text>
    <line x1="0" y1="90" x2="1440" y2="90" stroke="#1f2230"/>
  </g>

  <!-- 히어로(좌) -->
  <g>
    <!-- 6.2 칩(NEW) 높이 34 pill + AI 배지 높이 26 pill -->
    <rect x="48" y="130" width="262" height="34" rx="17" fill="#11131c" stroke="#23263a"/>
    <text x="66" y="152" font-size="11" letter-spacing="1.5" fill="#8a8ea3">• NEW</text>
    <rect x="118" y="134" width="186" height="26" rx="13" fill="#1a1f4d"/>
    <text x="134" y="152" font-size="13" fill="#9fa8ff">✦</text>
    <text x="152" y="152" font-size="13" font-weight="600" fill="#ffffff">AI 상세페이지 생성</text>

    <!-- display 66/800/-2, 강조는 color-accent -->
    <text x="46" y="262" font-size="66" font-weight="800" letter-spacing="-2" fill="#ffffff">쿠팡 상세페이지,</text>
    <text x="46" y="342" font-size="66" font-weight="800" letter-spacing="-2" fill="#ffffff"><tspan fill="#4f63ff">AI</tspan>로 10분 만에.</text>

    <!-- body-lg 18, color-text-secondary, 행간 28 -->
    <text x="48" y="398" font-size="18" fill="#b9bccb">경쟁사 분석부터 상세페이지 생성, 편집, WING 등록용 HTML까지</text>
    <text x="48" y="426" font-size="18" fill="#b9bccb">버튼 몇 번으로 끝내세요. 결제는 최종 확정할 때만 1크레딧.</text>

    <!-- Primary(히어로) 52x206 btn-lg/600 + 텍스트 링크형 -->
    <rect x="48" y="466" width="206" height="52" rx="4" fill="#4353ff"/>
    <text x="151" y="498" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">시작하기 — 무료 체험</text>
    <text x="282" y="498" font-size="16" font-weight="600" fill="#ffffff">로그인</text>
    <path d="M338 487 l6 6 -6 6" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- 6.3 아이콘 타일 38x38 radius-md + 제목 ui-sm/700 + 설명 muted(행간 18) -->
    <g font-size="13">
      <rect x="48" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="67" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">⌕</text>
      <text x="100" y="580" font-weight="700" fill="#ffffff">경쟁사 분석</text>
      <text x="100" y="602" fill="#8a8ea3">1위 상품 리뷰에서</text>
      <text x="100" y="620" fill="#8a8ea3">소구점(USP)을 추출</text>

      <rect x="252" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="271" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">✦</text>
      <text x="304" y="580" font-weight="700" fill="#ffffff">AI 상세페이지</text>
      <text x="304" y="602" fill="#8a8ea3">780px 모바일 규격</text>
      <text x="304" y="620" fill="#8a8ea3">레이아웃을 자동 생성</text>

      <rect x="456" y="566" width="38" height="38" rx="6" fill="#141726"/>
      <text x="475" y="591" font-size="16" fill="#6f7dff" text-anchor="middle">⇪</text>
      <text x="508" y="580" font-weight="700" fill="#ffffff">WING 등록</text>
      <text x="508" y="602" fill="#8a8ea3">확정한 HTML을 복사해</text>
      <text x="508" y="620" fill="#8a8ea3">상세설명에 붙여넣기</text>
    </g>
  </g>

  <!-- 히어로(우): 에디터 미리보기(장식, 7장 매핑 "우측 에디터 목업") -->
  <g>
    <!-- 에디터 프레임 color-bg-frame, 1px color-border, radius-lg -->
    <rect x="672" y="120" width="720" height="510" rx="8" fill="#0e1016" stroke="#1f2230"/>
    <!-- 6.7 툴바 높이 40 -->
    <path d="M680 120 h704 a8 8 0 0 1 8 8 v32 h-720 v-32 a8 8 0 0 1 8 -8 z" fill="#12141c"/>
    <rect x="684" y="130" width="20" height="20" rx="4" fill="#4353ff"/>
    <rect x="716" y="129" width="96" height="22" rx="4" fill="#1b1e2a"/>
    <text x="728" y="145" font-size="12" fill="#d7d9e3">에디터 ▾</text>
    <text x="830" y="145" font-size="12" fill="#8a8ea3">무선 청소기 · EDITING · v4</text>
    <text x="1180" y="145" font-size="12" fill="#8a8ea3">재생성 2/3</text>
    <rect x="1262" y="128" width="118" height="24" rx="4" fill="#4353ff"/>
    <text x="1321" y="145" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">퍼블리시 · 1크레딧</text>

    <!-- 아이콘 바 38px color-bg-iconbar, 아이콘 color-icon -->
    <path d="M672 160 h38 v462 a8 8 0 0 1 -8 8 h-22 a8 8 0 0 1 -8 -8 z" fill="#0b0d12"/>
    <g fill="none" stroke="#5c6075" stroke-width="1.5">
      <path d="M684 188 h14 M691 181 v14"/>
      <rect x="684" y="222" width="14" height="14" rx="2"/>
      <circle cx="691" cy="268" r="7"/>
      <path d="M684 306 h14 M684 312 h14 M684 318 h10"/>
    </g>

    <!-- 프리뷰 캔버스 gradient-canvas + 6.10 워터마크 -->
    <g clip-path="url(#canvasClip)">
      <rect x="710" y="160" width="682" height="390" fill="url(#canvas)"/>
      <circle cx="1040" cy="360" r="160" fill="#3346ff" fill-opacity="0.35"/>
      <rect x="930" y="230" width="170" height="250" rx="10" fill="#0a0d28" fill-opacity="0.7" stroke="#3b4bd8" stroke-opacity="0.5"/>
      <text x="1015" y="360" font-size="13" fill="#6f7dff" text-anchor="middle">[상품 이미지]</text>
      <text x="740" y="200" font-size="16" font-weight="700" fill="#ffffff">프리미엄 무선청소기</text>
      <text x="740" y="282" font-size="38" font-weight="700" letter-spacing="-1" fill="#ffffff">흡입력은</text>
      <text x="740" y="328" font-size="38" font-weight="700" letter-spacing="-1" fill="#ffffff">두 배,</text>
      <text x="740" y="374" font-size="38" font-weight="700" letter-spacing="-1" fill="#ffffff">무게는 절반</text>
      <text x="740" y="410" font-size="12" fill="#c3c8f5">리뷰 3,200건이 증명한 42dB 저소음.</text>
      <text x="740" y="428" font-size="12" fill="#c3c8f5">한 번 충전으로 60분 연속 사용.</text>
      <!-- Outline 버튼 높이 34, 1px #e6e7ee -->
      <rect x="740" y="448" width="112" height="34" rx="4" fill="none" stroke="#e6e7ee"/>
      <text x="796" y="470" font-size="12" fill="#ffffff" text-anchor="middle">지금 구매하기</text>
      <rect x="710" y="160" width="682" height="390" fill="url(#wm)"/>
      <text x="880" y="530" font-size="26" font-weight="800" fill="#ffffff" fill-opacity="0.18" transform="rotate(-18 880 530)">PREVIEW ONLY / 무단 복제 금지</text>
    </g>

    <!-- 6.4 패널 + 6.5 체크박스 + 생성 버튼(color-brand-alt) -->
    <rect x="1148" y="196" width="224" height="264" rx="8" fill="#12141d" stroke="#262a3b"/>
    <text x="1164" y="224" font-size="13" font-weight="700" fill="#ffffff"><tspan fill="#8f9bff">✦</tspan> USP 제안</text>
    <rect x="1240" y="212" width="42" height="16" rx="3" fill="#1d2140"/>
    <text x="1261" y="224" font-size="10" fill="#9fa8ff" text-anchor="middle">LIGHT</text>
    <text x="1356" y="224" font-size="13" fill="#6d7185">×</text>
    <text x="1164" y="250" font-size="11" fill="#8a8ea3">경쟁사 리뷰에서 찾은 소구점</text>
    <g font-size="12" fill="#d7d9e3">
      <rect x="1164" y="266" width="14" height="14" rx="3" fill="#4353ff"/><path d="M1167 273 l3 3 5 -6" stroke="#ffffff" fill="none" stroke-width="1.6"/>
      <text x="1186" y="278">강력한 흡입력</text>
      <rect x="1164" y="292" width="14" height="14" rx="3" fill="#4353ff"/><path d="M1167 299 l3 3 5 -6" stroke="#ffffff" fill="none" stroke-width="1.6"/>
      <text x="1186" y="304">가벼운 무게</text>
      <rect x="1164" y="318" width="14" height="14" rx="3" fill="none" stroke="#4a4e63"/>
      <text x="1186" y="330">긴 배터리 시간</text>
      <rect x="1164" y="344" width="14" height="14" rx="3" fill="none" stroke="#4a4e63"/>
      <text x="1186" y="356">저소음</text>
    </g>
    <text x="1164" y="388" font-size="10" fill="#6d7185">분석 시도 1/3</text>
    <rect x="1164" y="402" width="192" height="40" rx="4" fill="#5247ff"/>
    <text x="1260" y="427" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">✦ 상세페이지 생성</text>

    <!-- 6.9 코드 블록 color-bg-code -->
    <rect x="722" y="562" width="658" height="56" rx="6" fill="#0a0b10" stroke="#1c1f2b"/>
    <g font-family="Consolas, 'D2Coding', monospace" font-size="12">
      <text x="738" y="586" fill="#e0a86a">&lt;section <tspan fill="#7fb0ff">data-block-id</tspan>=<tspan fill="#9fd48a">"hero"</tspan> <tspan fill="#7fb0ff">style</tspan>=<tspan fill="#9fd48a">"width:780px"</tspan>&gt;<tspan fill="#d7d9e3">…</tspan>&lt;/section&gt;</text>
      <text x="738" y="606" fill="#4d5166">// 인라인 CSS 전용 · script 없음</text>
    </g>
  </g>

  <!-- 작동 방식(4): 캡션 caption-caps + 단계 카드 5개(6.4 패널) -->
  <g>
    <text x="48" y="718" font-size="11" letter-spacing="2" fill="#6d7185">작동 방식 — 5단계</text>
    <text x="48" y="756" font-size="19" font-weight="700" fill="#ffffff">분석부터 WING 등록까지, 한 흐름으로</text>
    <g font-size="13">
      <!-- 카드 폭 256, 간격 16 -->
      <rect x="48" y="784" width="256" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
      <text x="68" y="820" font-size="14" font-weight="700" fill="#4f63ff">1</text>
      <text x="68" y="848" font-weight="700" fill="#ffffff">경쟁사 분석 <tspan font-weight="400" fill="#8a8ea3">(선택)</tspan></text>
      <text x="68" y="874" fill="#8a8ea3">쿠팡 1위 상품 URL로</text>
      <text x="68" y="892" fill="#8a8ea3">리뷰 속 소구점을 찾습니다</text>

      <rect x="320" y="784" width="256" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
      <text x="340" y="820" font-size="14" font-weight="700" fill="#4f63ff">2</text>
      <text x="340" y="848" font-weight="700" fill="#ffffff">상세페이지 생성</text>
      <text x="340" y="874" fill="#8a8ea3">제품 정보와 이미지로</text>
      <text x="340" y="892" fill="#8a8ea3">780px 상세페이지를 만듭니다</text>

      <rect x="592" y="784" width="256" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
      <text x="612" y="820" font-size="14" font-weight="700" fill="#4f63ff">3</text>
      <text x="612" y="848" font-weight="700" fill="#ffffff">편집</text>
      <text x="612" y="874" fill="#8a8ea3">블록을 골라 문구를 고치고</text>
      <text x="612" y="892" fill="#8a8ea3">필요하면 재생성합니다</text>

      <rect x="864" y="784" width="256" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
      <text x="884" y="820" font-size="14" font-weight="700" fill="#4f63ff">4</text>
      <text x="884" y="848" font-weight="700" fill="#ffffff">확정 <tspan font-weight="400" fill="#8a8ea3">(크레딧 1)</tspan></text>
      <text x="884" y="874" fill="#8a8ea3">워터마크 없는 최종 HTML을</text>
      <text x="884" y="892" fill="#8a8ea3">받을 때만 차감됩니다</text>

      <rect x="1136" y="784" width="256" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
      <text x="1156" y="820" font-size="14" font-weight="700" fill="#4f63ff">5</text>
      <text x="1156" y="848" font-weight="700" fill="#ffffff">HTML 복사 → WING</text>
      <text x="1156" y="874" fill="#8a8ea3">복사한 HTML을 상세설명에</text>
      <text x="1156" y="892" fill="#8a8ea3">붙여 넣으면 끝입니다</text>
    </g>
  </g>

  <!-- 하단 CTA(3, 반복): 6.4 패널 + Primary(히어로) -->
  <g>
    <rect x="48" y="992" width="1344" height="148" rx="8" fill="#12141d" stroke="#262a3b"/>
    <text x="88" y="1056" font-size="18" font-weight="600" fill="#ffffff">첫 상세페이지를 지금 만들어 보세요.</text>
    <text x="88" y="1086" font-size="15" fill="#b9bccb">확정하기 전까지는 크레딧이 차감되지 않습니다.</text>
    <rect x="1146" y="1040" width="206" height="52" rx="4" fill="#4353ff"/>
    <text x="1249" y="1072" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">시작하기 — 무료 체험</text>
  </g>

  <!-- 푸터: caption, color-text-disabled(주석 전용) -->
  <line x1="48" y1="1200" x2="1392" y2="1200" stroke="#1f2230"/>
  <text x="48" y="1240" font-size="11" fill="#4d5166">© Coupang AI Detail Maker</text>
  <text x="48" y="1320" font-size="11" fill="#4d5166">WF-01 정적 랜딩 · docs/9-style-guide.md v0.1 적용 · 구조는 와이어프레임 WF-01 · 카피는 예시(확인 필요 N-1) · 정적 HTML, JS 없음(BR-80)</text>
</svg>
